<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Fiverr Gig Scraper</h2>

    <input id="keyword" type="text" placeholder="e.g. SaaS MVP development" />

    <div class="row pages-row">
      <label>Pages</label>
      <input id="pages" type="number" min="1" max="20" value="1" />
    </div>

    <div class="row">
      <button id="startBtn">Scrape</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <div id="status" class="status">Enter a keyword and click Scrape.</div>

    <div id="progressWrap" class="progress-wrap" style="display:none">
      <div id="bar" class="bar"></div>
    </div>

    <div id="log" class="log"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
